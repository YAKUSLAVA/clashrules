[custom]
; ==========================================================
; 优化融合模板 v1.0 · 实用小技主框架 + 安格世界兜底
; - GEOSITE 优先（速度 & 准确）
; - GEOSITE 没匹配到的 → 安格世界经典列表自动兜底
; - 来源：Aethersailor + metacubex + liandu2024/blackmatrix7 (GitHub)
; ==========================================================

enable_rule_generator=true
overwrite_original_rules=true

; ==========================================================
; 1) 规则（GEOSITE 优先 + 安格世界兜底）
; ==========================================================

; ==========================================================
; 1) 规则（GEOSITE 优先 + 安格世界兜底）
; ==========================================================
;屏蔽adobe 给足权限排最上，单纯在应用层选择屏蔽只会屏蔽国外链接，因为国内也能访问adobe部分页面，因此在openclash中如果选择了绕过大陆，
;国内能访问的adobe域名或ip也就跟着绕过了内核直接走了直连，所以还需在【流量控制】菜单下的【绕过指定区域 IPv4 黑名单中】加上adobe域名：如下
;adobe.com
;adobelogin.com
;adobe.io
;behance.net

; --- 私网 & 直连补丁（MRS）---
ruleset=DIRECT,[]GEOSITE,private
ruleset=DIRECT,[]GEOIP,private,no-resolve
ruleset=DIRECT,clash-domain:https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs,28800
ruleset=DIRECT,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.yaml,28800   ; 少量 classical 兜底

; --- 国内直连（MRS）---
ruleset=DIRECT,[]GEOSITE,cn
ruleset=DIRECT,[]GEOIP,cn,no-resolve
ruleset=DIRECT,[]GEOSITE,google-cn
ruleset=DIRECT,[]GEOSITE,category-games@cn
ruleset=DIRECT,[]GEOSITE,category-game-platforms-download
ruleset=DIRECT,[]GEOSITE,category-public-tracker

;------------请在下方区域内添加应用---------------
; --- 核心应用（MRS 优先）---

ruleset=🧠 AI,[]GEOSITE,category-ai-!cn
ruleset=🧠 AI,[]GEOSITE,openai
ruleset=🧠 AI,https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat/meta/geo/geosite/openai.mrs,86400
ruleset=🧠 AI,https://raw.githubusercontent.com/liandu2024/clash/refs/heads/main/list/AI.list   ; 安格兜底（无 mrs）

ruleset=🍎 Apple,[]GEOSITE,apple
ruleset=🍎 Apple,https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat/meta/geo/geosite/apple.mrs,86400

ruleset=🟦 OKX,[]GEOSITE,okx
ruleset=🟨 Binance,[]GEOSITE,binance
ruleset=🟪 Bybit,[]GEOSITE,bybit

ruleset=📨 Telegram,[]GEOSITE,telegram
ruleset=📨 Telegram,[]GEOIP,telegram,no-resolve
ruleset=📨 Telegram,https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat/meta/geo/geosite/telegram.mrs,86400

ruleset=🐦 X,[]GEOSITE,twitter
ruleset=🐦 X,[]GEOSITE,X
ruleset=🐦 X,https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat/meta/geo/geosite/twitter.mrs,86400

ruleset=🎮 Steam,[]GEOSITE,steam
ruleset=🎮 Steam,https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat/meta/geo/geosite/steam.mrs,86400

ruleset=🎬 YouTube,[]GEOSITE,youtube
ruleset=🎬 YouTube,https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat/meta/geo/geosite/youtube.mrs,86400

ruleset=🛠 GitHub,[]GEOSITE,github
ruleset=🛠 GitHub,https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat/meta/geo/geosite/github.mrs,86400

; ==========================================================
; --- 若使用上方geo没有匹配到可以用下方url来匹配，需先在上方删除该应用的ruleset ---
; --- ruleset=🟦 OKX,clash-domain:https://xxx/okx.yaml,86400
; ==========================================================

;------------ 大类/平台 ---------------

ruleset=📞 即时通讯,[]GEOSITE,category-communication
ruleset=💬 社交媒体,[]GEOSITE,category-social-media-!cn

ruleset=🐶 Google,[]GEOSITE,google
ruleset=🐶 Google,[]GEOIP,google,no-resolve
ruleset=🐶 Google,https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat/meta/geo/geosite/google.mrs,86400

ruleset=🪟 Microsoft,[]GEOSITE,microsoft
ruleset=🪟 Microsoft,https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat/meta/geo/geosite/microsoft.mrs,86400

ruleset=☁️ cloudflare,[]GEOSITE,cloudflare
ruleset=☁️ cloudflare,[]GEOIP,cloudflare,no-resolve

; --- Porn ---
ruleset=🔞 Porn,[]GEOSITE,category-porn

; --- GFW 兜底 ---
ruleset=🧱 国外兜底,[]GEOSITE,gfw
ruleset=🧱 国外兜底,clash-domain:https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat/meta/geo/geosite/gfw.mrs,86400
ruleset=🧱 国外兜底,https://raw.githubusercontent.com/liandu2024/clash/refs/heads/main/list/Proxy.list,86400   ; 安格兜底

; --- 非标端口 ---
ruleset=🔀 非标端口,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Port_Direct.yaml,28800

; --- 最终兜底 ---
ruleset=🐟 漏网之鱼,[]FINAL


; ==========================================================
; 2) 应用分流策略组（UI 主入口，不越权）
;    说明：每个应用都加入「🧊 冷门节点」可选
; ==========================================================
;------------请在下方区域内添加应用---------------
custom_proxy_group=🧠 AI`select`[]🔰 自建纯净`[]🧭 手动选择`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点
custom_proxy_group=🎬 YouTube`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点
custom_proxy_group=🍎 Apple`select`[]🔰 自建纯净`[]🧭 手动选择`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点
custom_proxy_group=🎮 Steam`select`[]DIRECT`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点
custom_proxy_group=📨 Telegram`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点
custom_proxy_group=🐦 X`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点
custom_proxy_group=🎵 TikTok`select`[]🔰 自建纯净`[]🧭 手动选择`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点
custom_proxy_group=🛠 GitHub`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点

custom_proxy_group=📞 即时通讯`select`[]🔰 自建纯净`[]🧭 手动选择`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点
custom_proxy_group=💬 社交媒体`select`[]🔰 自建纯净`[]🧭 手动选择`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点
custom_proxy_group=🚝 测速工具`select`[]🔰 自建纯净`[]🧭 手动选择`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点

custom_proxy_group=🟦 OKX`select`[]🔰 自建纯净`[]🧭 手动选择`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点
custom_proxy_group=🟨 Binance`select`[]🔰 自建纯净`[]🧭 手动选择`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点
custom_proxy_group=🟪 Bybit`select`[]🔰 自建纯净`[]🧭 手动选择`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点
;------------请在上方区域内添加---------------

custom_proxy_group=🐶 Google`select`[]🔰 自建纯净`[]🧭 手动选择`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点
custom_proxy_group=☁️ cloudflare`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点
; Microsoft：允许直连优先，同时也能选五区/冷门/Default
custom_proxy_group=🪟 Microsoft`select`[]🔰 自建纯净`[]🧭 手动选择`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点
custom_proxy_group=🔞 Porn`select`[]🧭 手动选择`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点

; ==========================================================
; 3) Default / 漏网之鱼（唯一允许全节点）
;    同时新增：🧊 冷门节点（只收非 HK/JP/TW/US/SG 的节点）
; ==========================================================
custom_proxy_group=🧱 国外兜底`select`[]♻️ 自动选择`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 手动选择`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]DIRECT`[]♻️ 自动选择`[]🧊 冷门节点`[]🧭 手动选择`[]🧱 国外兜底
; ==========================================================
; 4) 非标端口
; ==========================================================
custom_proxy_group=🔀 非标端口`select`[]🐟 漏网之鱼`[]DIRECT


; ==========================================================
; 5) 国家节点测速组（保持不动）
; ==========================================================
; 全节点（允许任何节点显示）
custom_proxy_group=🔰 自建纯净`select`(?i)(自建|纯净|限流)
custom_proxy_group=🧭 手动选择`select`.*
custom_proxy_group=♻️ 自动选择`url-test`.*(?<!自建|纯净|限流)`https://www.gstatic.com/generate_204`300,,100
custom_proxy_group=🇭🇰 HK`url-test`(?i)(🇭🇰|香港|\\bHK\\b|hongkong)(?!.*(自建|纯净|限流))`http://www.gstatic.com/generate_204`300,,100
custom_proxy_group=🇹🇼 TW`url-test`(?i)(🇹🇼|台湾|\\bTW\\b|taiwan|taipei|hinet)(?!.*(自建|纯净|限流))`http://www.gstatic.com/generate_204`300,,100
custom_proxy_group=🇯🇵 JP`url-test`(?i)(🇯🇵|日本|\\bJP\\b|tokyo|osaka)(?!.*(自建|纯净|限流))`http://www.gstatic.com/generate_204`300,,100
custom_proxy_group=🇸🇬 SG`url-test`(?i)(🇸🇬|新加坡|\\bSG\\b|singapore)(?!.*(自建|纯净|限流))`http://www.gstatic.com/generate_204`300,,100
custom_proxy_group=🇺🇸 US`url-test`(?i)(🇺🇸|美国|\\bUS\\b|united states)(?!.*(自建|纯净|限流))`http://www.gstatic.com/generate_204`300,,100
; 冷门节点池（排除 HK/JP/TW/US/SG）——selector 手动选择
; 说明：用负向匹配把五大区节点剔除，剩余即“冷门”
custom_proxy_group=🧊 冷门节点`select`(?i)^(?!.*(自建|纯净|限流|🇭🇰|香港|\\bHK\\b|hong\\s*kong|🇯🇵|日本|\\bJP\\b|tokyo|osaka|🇹🇼|台湾|\\bTW\\b|taiwan|taipei|hinet|🇸🇬|新加坡|\\bSG\\b|singapore|🇺🇸|美国|\\bUS\\b|united\\s*states|los\\s*angeles|san\\s*jose|seattle|new\\s*york)).*
